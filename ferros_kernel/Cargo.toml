[package]
name = "ferros_kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ferros bare-metal kernel — boots on aarch64, mounts the ledger"

[features]
default = ["pixel8"]
pixel8 = []
m1 = ["dep:ferros_hal_m1"]

[dependencies]
# Every number a person reads, in the base they chose (Code/tatau): the device base is loaded from the vault at boot (SETTINGS.md).
tatau = { path = "../../tatau" }
ferros_dsc = { path = "../ferros_dsc" }
ferros_dsi = { path = "../ferros_dsi" }
ferros_sandbox = { path = "../ferros_sandbox" }
ferros_hal = { path = "../ferros_hal", default-features = false, features = ["alloc"] }
ferros_hal_m1 = { path = "../ferros_hal_m1", optional = true }
ferros_layout = { path = "../ferros_layout" }
ferros_ext4 = { path = "../ferros_ext4" }
ferros_f2fs = { path = "../ferros_f2fs" }
blake3 = { version = "1", default-features = false, features = ["pure"] }
ferros_vault = { path = "../vault", default-features = false }
# The storage engine (the owner's, shared with Photon and the rest of the stack): mirrored 4 KiB blocks, generation ring, plow-managed tract, COW HAMT. no_std core; the kernel backs its BlockDev with UFS (kvault.rs).
manifestus = { path = "../../manifestus", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ferros_ledger = { path = "../ferros_ledger" }
ferros_pt = { path = "../ferros_pt", features = ["alloc"] }
ferros_heap = { path = "../ferros_heap" }
ihi = { path = "../../ihi", default-features = false }
vsf = { path = "../../vsf", default-features = false, features = ["crypto-verify"] }

[build-dependencies]
# Rasterises the "Ready?" gate text at build time (no font engine in the kernel).
fontdue = "0.9"
