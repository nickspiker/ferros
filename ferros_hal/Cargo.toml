[package]
name = "ferros_hal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hardware abstraction layer for ferros — MMIO, UART, framebuffer, storage"

[dependencies]
ferros_layout = { path = "../ferros_layout" }
ferros_vault = { path = "../ferros_vault", default-features = false, optional = true }
vsf-mini = { path = "../../vsf-mini" }
blake3 = { version = "1", default-features = false }

[features]
default = ["alloc"]
alloc = ["ferros_vault"]
std = ["alloc", "ferros_vault/std"]
