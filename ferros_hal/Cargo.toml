[package]
name = "ferros_hal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hardware abstraction layer for ferros — MMIO, UART, framebuffer, storage"

[dependencies]
ferros_layout = { path = "../ferros_layout" }
vsf = { path = "../../vsf", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure"] }

[features]
default = ["alloc"]
alloc = []
std = ["alloc"]
