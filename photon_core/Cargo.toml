[package]
name = "photon_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Photon's wire core without std: presence (ping/pong), photons (messages), acks — for a ferros process whose only I/O is UDP."

[lib]
path = "src/lib.rs"

[dependencies]
vsf = { path = "../../vsf", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure"] }
ed25519-dalek = { version = "2", default-features = false }
ihi = { path = "../../ihi", default-features = false }
chacha20 = { version = "0.9", default-features = false }
poly1305 = { version = "0.8", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.7", default-features = false }
raptorq = { version = "2.0.1", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# The fleet substrate without std (2026-10-26): the membership chain fold, the key bundle and egg verification, the bind request, the fan-out OPEN, the pairing words — the same code the desktop app and the worker run, so a chain the phone folds is the chain they fold.
fgtw = { path = "../../fgtw", default-features = false, features = ["fanout"] }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
