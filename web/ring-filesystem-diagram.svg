<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="diskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#32ff00;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#32ff00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#32ff00;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#0a0e13"/>

  <!-- Title -->
  <text x="450" y="35" font-family="'Oxanium', sans-serif" font-size="26" font-weight="300"
        fill="#32ff00" text-anchor="middle" filter="url(#glow)">
    Ring Filesystem Architecture
  </text>

  <!-- Main ring (disk) -->
  <circle cx="450" cy="300" r="180" fill="none" stroke="url(#diskGradient)"
          stroke-width="60" filter="url(#glow)" opacity="0.5"/>

  <!-- Superblock (random location) -->
  <g transform="rotate(45 450 300)">
    <rect x="440" y="110" width="20" height="30" fill="#ffaa00" filter="url(#glow)"/>
    <text x="450" y="95" font-family="'IBM Plex Mono', monospace" font-size="13"
          fill="#ffaa00" text-anchor="middle" font-weight="600">Superblock</text>
    <text x="450" y="78" font-family="'IBM Plex Serif', serif" font-size="11"
          fill="#8b949e" text-anchor="middle">(random pos)</text>
  </g>

  <!-- Header ring buffer markers -->
  <circle cx="350" cy="200" r="6" fill="#32ff00" opacity="0.8"/>
  <text x="350" y="185" font-family="'IBM Plex Mono', monospace" font-size="10"
        fill="#32ff00" text-anchor="middle">Gen 1002</text>

  <circle cx="520" cy="240" r="6" fill="#32ff00" opacity="0.9"/>
  <text x="520" y="225" font-family="'IBM Plex Mono', monospace" font-size="10"
        fill="#32ff00" text-anchor="middle">Gen 1003</text>

  <circle cx="580" cy="350" r="6" fill="#32ff00" opacity="1"/>
  <text x="580" y="335" font-family="'IBM Plex Mono', monospace" font-size="10"
        fill="#32ff00" text-anchor="middle" font-weight="600">Gen 1004</text>
  <text x="580" y="375" font-family="'IBM Plex Serif', serif" font-size="9"
        fill="#32ff00" text-anchor="middle">(highest)</text>

  <!-- Files scattered in ring -->
  <rect x="300" y="290" width="40" height="20" fill="#1f2937" stroke="#32ff00" stroke-width="1" rx="3"/>
  <text x="320" y="305" font-family="'IBM Plex Mono', monospace" font-size="9"
        fill="#32ff00" text-anchor="middle">file1</text>

  <rect x="480" y="380" width="40" height="20" fill="#1f2937" stroke="#32ff00" stroke-width="1" rx="3"/>
  <text x="500" y="395" font-family="'IBM Plex Mono', monospace" font-size="9"
        fill="#32ff00" text-anchor="middle">file2</text>

  <rect x="370" y="420" width="40" height="20" fill="#1f2937" stroke="#32ff00" stroke-width="1" rx="3"/>
  <text x="390" y="435" font-family="'IBM Plex Mono', monospace" font-size="9"
        fill="#32ff00" text-anchor="middle">file3</text>

  <!-- Dual SSD visualization -->
  <g id="dual-ssd">
    <!-- SSD 1 -->
    <rect x="50" y="100" width="200" height="80" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="6"/>
    <text x="150" y="125" font-family="'Oxanium', sans-serif" font-size="15" fill="#32ff00"
          text-anchor="middle" font-weight="600">SSD 1 (Samsung)</text>
    <text x="60" y="150" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Offset: 0x000000
    </text>
    <text x="60" y="168" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Ring starts here →
    </text>

    <!-- SSD 2 -->
    <rect x="50" y="200" width="200" height="80" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="6"/>
    <text x="150" y="225" font-family="'Oxanium', sans-serif" font-size="15" fill="#32ff00"
          text-anchor="middle" font-weight="600">SSD 2 (WD)</text>
    <text x="60" y="250" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Offset: 0x3A2F81
    </text>
    <text x="60" y="268" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Ring offset for resilience
    </text>
  </g>

  <!-- Power loss recovery -->
  <rect x="650" y="100" width="220" height="180" fill="#1f2937" stroke="#ffaa00" stroke-width="2" rx="8"/>
  <text x="760" y="125" font-family="'Oxanium', sans-serif" font-size="16" fill="#ffaa00"
        text-anchor="middle" font-weight="600">Power Loss Recovery</text>

  <text x="660" y="150" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    1. Power restored
  </text>
  <text x="660" y="170" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    2. Scan header ring buffer
  </text>
  <text x="660" y="190" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    3. Find highest gen number
  </text>
  <text x="660" y="210" font-family="'IBM Plex Serif', serif" font-size="12" fill="#32ff00">
    4. Continue from there
  </text>
  <text x="660" y="235" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#32ff00"
        font-weight="600">No fsck. No journal.</text>
  <text x="660" y="255" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#32ff00"
        font-weight="600">No "repair needed".</text>

  <!-- Stochastic placement -->
  <rect x="650" y="300" width="220" height="120" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="760" y="325" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        text-anchor="middle" font-weight="600">Stochastic Placement</text>

  <text x="660" y="350" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    • Natural wear leveling
  </text>
  <text x="660" y="370" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    • Exploit prevention
  </text>
  <text x="660" y="390" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    • No predictable layout
  </text>
  <text x="660" y="410" font-family="'IBM Plex Serif', serif" font-size="12" fill="#32ff00">
    • Blocks scattered randomly
  </text>

  <!-- Bottom explanation -->
  <rect x="50" y="500" width="800" height="130" fill="#1f2937" rx="8" opacity="0.9"/>

  <text x="60" y="525" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        font-weight="600">Key Features:</text>

  <text x="60" y="550" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    • Superblock at random location (stored encrypted in UEFI)
  </text>
  <text x="60" y="570" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    • Dual SSDs at different offsets (different manufacturers for resilience)
  </text>
  <text x="60" y="590" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    • Header ring buffer with 1000+ valid generation states
  </text>
  <text x="60" y="610" font-family="'IBM Plex Serif', serif" font-size="13" fill="#32ff00">
    • Any ring state is valid → power loss is normal operation
  </text>
</svg>
