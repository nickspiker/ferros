<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#32ff00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0a0e13"/>

  <!-- Title -->
  <text x="450" y="35" font-family="'Oxanium', sans-serif" font-size="26" font-weight="300"
        fill="#32ff00" text-anchor="middle" filter="url(#glow)">
    TOKEN: Passless Authentication (A=1)
  </text>

  <!-- Step 1: Device Fingerprint -->
  <rect x="50" y="80" width="200" height="120" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="150" y="105" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        text-anchor="middle" font-weight="600">Device</text>
  <text x="150" y="125" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        text-anchor="middle" font-weight="600">Fingerprint</text>
  <text x="60" y="150" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8b949e">
    • Android_ID
  </text>
  <text x="60" y="168" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8b949e">
    • IMEI
  </text>
  <text x="60" y="186" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8b949e">
    • Hardware chars
  </text>

  <!-- Arrow 1 -->
  <path d="M 255 140 L 295 140" stroke="#32ff00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="130" font-family="'IBM Plex Serif', serif" font-size="12" fill="#32ff00">
    generates
  </text>

  <!-- Step 2: Social Attestation -->
  <rect x="300" y="80" width="200" height="120" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="400" y="105" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        text-anchor="middle" font-weight="600">Social</text>
  <text x="400" y="125" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        text-anchor="middle" font-weight="600">Attestation</text>
  <text x="310" y="150" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Friends vouch:
  </text>
  <text x="310" y="168" font-family="'IBM Plex Serif', serif" font-size="11" fill="#ffaa00"
        font-style="italic">"This is Nick's phone"
  </text>
  <text x="310" y="186" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8b949e">
    Device → Human
  </text>

  <!-- Arrow 2 -->
  <path d="M 505 140 L 545 140" stroke="#32ff00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="130" font-family="'IBM Plex Serif', serif" font-size="12" fill="#32ff00">
    maps to
  </text>

  <!-- Step 3: Key Derivation -->
  <rect x="550" y="80" width="200" height="120" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="650" y="105" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        text-anchor="middle" font-weight="600">Keys in</text>
  <text x="650" y="125" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        text-anchor="middle" font-weight="600">CSRs</text>
  <text x="560" y="150" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Deterministic
  </text>
  <text x="560" y="168" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Hardware-isolated
  </text>
  <text x="560" y="186" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#32ff00">
    Read-proof
  </text>

  <!-- Authenticate once label -->
  <rect x="300" y="220" width="300" height="40" fill="#1f2937" stroke="#ffaa00" stroke-width="2" rx="8"/>
  <text x="450" y="245" font-family="'Oxanium', sans-serif" font-size="20" fill="#ffaa00"
        text-anchor="middle" font-weight="600">A = 1 (Authenticate Once)</text>

  <!-- Divider -->
  <line x1="50" y1="290" x2="850" y2="290" stroke="#32ff00" stroke-width="1" opacity="0.3"/>

  <!-- Use Cases Section -->
  <text x="450" y="320" font-family="'Oxanium', sans-serif" font-size="18" fill="#32ff00"
        text-anchor="middle" font-weight="600">Use Cases</text>

  <!-- Device Loss -->
  <rect x="50" y="340" width="250" height="90" fill="#1f2937" stroke="#ff3232" stroke-width="2" rx="8"/>
  <text x="175" y="365" font-family="'Oxanium', sans-serif" font-size="15" fill="#ff3232"
        text-anchor="middle" font-weight="600">Device Lost?</text>
  <text x="60" y="388" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Friends vote to revoke
  </text>
  <text x="60" y="408" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Threshold reached → keys invalid
  </text>

  <!-- Multiple Devices -->
  <rect x="325" y="340" width="250" height="90" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="450" y="365" font-family="'Oxanium', sans-serif" font-size="15" fill="#32ff00"
        text-anchor="middle" font-weight="600">Multiple Devices?</text>
  <text x="335" y="388" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Each independently attested
  </text>
  <text x="335" y="408" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Same identity, different keys
  </text>

  <!-- NFID -->
  <rect x="600" y="340" width="250" height="90" fill="#1f2937" stroke="#ffaa00" stroke-width="2" rx="8"/>
  <text x="725" y="365" font-family="'Oxanium', sans-serif" font-size="15" fill="#ffaa00"
        text-anchor="middle" font-weight="600">NFID (Optional)</text>
  <text x="610" y="388" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Prevent unauthorized binding
  </text>
  <text x="610" y="408" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    (paranoia layer for device add)
  </text>

  <!-- Comparison box -->
  <rect x="50" y="460" width="800" height="120" fill="#1f2937" rx="8" opacity="0.9"/>

  <text x="60" y="485" font-family="'Oxanium', sans-serif" font-size="16" fill="#ff3232"
        font-weight="600">Traditional:</text>
  <text x="60" y="507" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    Password + 2FA every session. Biometric theater. Forgot password flow. SMS intercepts.
  </text>
  <text x="60" y="527" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#ff3232">
    A = ∞ (authenticate forever)
  </text>

  <text x="60" y="555" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        font-weight="600">TOKEN:</text>
  <text x="180" y="555" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    Device fingerprint + social attestation. No passwords. No biometrics. No 2FA.
  </text>
  <text x="180" y="575" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#32ff00">
    A = 1 (authenticate once, device lifetime)
  </text>
</svg>
