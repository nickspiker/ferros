<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#32ff00"/>
    </marker>

    <!-- Spectral colors -->
    <linearGradient id="spectralGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3aff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#32ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff1e1e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#0a0e13"/>

  <!-- Title -->
  <text x="500" y="35" font-family="'Oxanium', sans-serif" font-size="26" font-weight="300"
        fill="#32ff00" text-anchor="middle" filter="url(#glow)">
    VSF Compositor: Spectral Color Pipeline
  </text>

  <!-- Spectral Color Bar -->
  <rect x="100" y="60" width="800" height="30" fill="url(#spectralGradient)" rx="15"/>
  <text x="150" y="82" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#fff">462nm</text>
  <text x="480" y="82" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#000">523nm</text>
  <text x="820" y="82" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#fff">703nm</text>

  <!-- Traditional Stack (Left) -->
  <g id="traditional">
    <text x="200" y="130" font-family="'Oxanium', sans-serif" font-size="18" fill="#ff3232"
          text-anchor="middle" font-weight="600">Traditional Stack</text>

    <!-- HTML layer -->
    <rect x="100" y="150" width="200" height="60" fill="#1f2937" stroke="#ff3232" stroke-width="2" rx="6"/>
    <text x="200" y="175" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#ff3232"
          text-anchor="middle" font-weight="600">HTML</text>
    <text x="110" y="195" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Structure + Content
    </text>

    <!-- CSS layer -->
    <rect x="100" y="220" width="200" height="60" fill="#1f2937" stroke="#ff3232" stroke-width="2" rx="6"/>
    <text x="200" y="245" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#ff3232"
          text-anchor="middle" font-weight="600">CSS</text>
    <text x="110" y="265" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Layout + Styling
    </text>

    <!-- JS layer -->
    <rect x="100" y="290" width="200" height="60" fill="#1f2937" stroke="#ff3232" stroke-width="2" rx="6"/>
    <text x="200" y="315" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#ff3232"
          text-anchor="middle" font-weight="600">JavaScript</text>
    <text x="110" y="335" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Behavior + Interaction
    </text>

    <!-- Browser Engine -->
    <rect x="100" y="360" width="200" height="60" fill="#1f2937" stroke="#ff3232" stroke-width="2" rx="6"/>
    <text x="200" y="385" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#ff3232"
          text-anchor="middle" font-weight="600">Browser Engine</text>
    <text x="110" y="405" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Parse + Render + JIT
    </text>

    <!-- Compositor -->
    <rect x="100" y="430" width="200" height="60" fill="#1f2937" stroke="#ff3232" stroke-width="2" rx="6"/>
    <text x="200" y="455" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#ff3232"
          text-anchor="middle" font-weight="600">Compositor</text>
    <text x="110" y="475" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Layers + Backing
    </text>

    <!-- Display -->
    <rect x="100" y="500" width="200" height="50" fill="#1f2937" stroke="#ff3232" stroke-width="2" rx="6"/>
    <text x="200" y="530" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#ff3232"
          text-anchor="middle" font-weight="600">Display (sRGB)</text>
  </g>

  <!-- VSF Stack (Right) -->
  <g id="vsf">
    <text x="750" y="130" font-family="'Oxanium', sans-serif" font-size="18" fill="#32ff00"
          text-anchor="middle" font-weight="600">VSF Stack</text>

    <!-- VSF Format -->
    <rect x="650" y="150" width="200" height="100" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="6"/>
    <text x="750" y="180" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#32ff00"
          text-anchor="middle" font-weight="600">VSF</text>
    <text x="660" y="200" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Structure + Style +
    </text>
    <text x="660" y="215" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Behavior + Layout
    </text>
    <text x="660" y="235" font-family="'IBM Plex Serif', serif" font-size="11" fill="#32ff00">
      (unified format)
    </text>

    <!-- Ring Compositor -->
    <rect x="650" y="260" width="200" height="100" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="6"/>
    <text x="750" y="285" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#32ff00"
          text-anchor="middle" font-weight="600">Ring Compositor</text>
    <text x="660" y="305" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      • Occlusion-aware
    </text>
    <text x="660" y="323" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      • Damage tracking
    </text>
    <text x="660" y="341" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      • No backing stores
    </text>

    <!-- Spectral Renderer -->
    <rect x="650" y="370" width="200" height="80" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="6"/>
    <text x="750" y="395" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#32ff00"
          text-anchor="middle" font-weight="600">Spectral Renderer</text>
    <text x="660" y="415" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      462nm | 523nm | 703nm
    </text>
    <text x="660" y="433" font-family="'IBM Plex Serif', serif" font-size="11" fill="#32ff00">
      Direct ring render
    </text>

    <!-- Display -->
    <rect x="650" y="460" width="200" height="50" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="6"/>
    <text x="750" y="490" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#32ff00"
          text-anchor="middle" font-weight="600">Display (Spectral)</text>
  </g>

  <!-- Comparison arrows -->
  <path d="M 310 320 L 640 320" stroke="#8b949e" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="475" y="315" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e"
        text-anchor="middle">Simplified</text>

  <!-- Performance comparison box -->
  <rect x="50" y="570" width="900" height="110" fill="#1f2937" rx="8" opacity="0.9"/>

  <text x="60" y="595" font-family="'Oxanium', sans-serif" font-size="16" fill="#ff3232"
        font-weight="600">Traditional:</text>
  <text x="60" y="617" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    Parse HTML → Build DOM → Parse CSS → Build CSSOM → JS execution → Layout → Paint →
  </text>
  <text x="60" y="637" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    Composite layers → Display. Renders everything, even occluded content.
  </text>
  <text x="60" y="657" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#ff3232"
        font-weight="600">Performance: Wasteful, color inaccurate (sRGB)</text>

  <text x="500" y="595" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        font-weight="600">VSF:</text>
  <text x="560" y="595" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    Parse VSF → Ring render → Display.
  </text>
  <text x="560" y="617" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    Only damaged regions redraw. Occluded widgets don't render at all.
  </text>
  <text x="560" y="637" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    Spectral color from sensor to display (462nm/523nm/703nm).
  </text>
  <text x="560" y="657" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#32ff00"
        font-weight="600">Performance: Efficient, color accurate</text>
</svg>
