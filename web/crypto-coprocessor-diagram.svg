<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#32ff00"/>
    </marker>

    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ffaa00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0a0e13"/>

  <!-- Title -->
  <text x="450" y="35" font-family="'Oxanium', sans-serif" font-size="26" font-weight="300"
        fill="#32ff00" text-anchor="middle" filter="url(#glow)">
    ChaCha20 Crypto Coprocessor
  </text>

  <!-- CSRs (CPU registers) -->
  <rect x="50" y="100" width="180" height="140" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="140" y="130" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        text-anchor="middle" font-weight="600">CPU CSRs</text>
  <text x="60" y="155" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8b949e">
    csr_key_1: 0x██████
  </text>
  <text x="60" y="175" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8b949e">
    csr_key_2: 0x██████
  </text>
  <text x="60" y="195" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8b949e">
    csr_key_3: 0x██████
  </text>
  <text x="60" y="220" font-family="'IBM Plex Serif', serif" font-size="10" fill="#32ff00">
    Write-only, read-disabled
  </text>

  <!-- Arrow from CSR to Crypto Unit -->
  <path d="M 235 170 L 295 170" stroke="#32ff00" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="265" y="160" font-family="'IBM Plex Serif', serif" font-size="11" fill="#32ff00">
    Keys
  </text>

  <!-- Crypto Coprocessor Unit -->
  <rect x="300" y="100" width="250" height="140" fill="#1f2937" stroke="#ffaa00" stroke-width="3" rx="8"/>
  <text x="425" y="130" font-family="'Oxanium', sans-serif" font-size="18" fill="#ffaa00"
        text-anchor="middle" font-weight="600">ChaCha20</text>
  <text x="425" y="150" font-family="'Oxanium', sans-serif" font-size="18" fill="#ffaa00"
        text-anchor="middle" font-weight="600">Coprocessor</text>

  <text x="310" y="180" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8b949e">
    • Dedicated silicon
  </text>
  <text x="310" y="200" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8b949e">
    • 64 bytes/cycle @ 1GHz
  </text>
  <text x="310" y="220" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#32ff00"
        font-weight="600">
    = 64 GB/s throughput
  </text>

  <!-- Data sources -->
  <g id="sources">
    <!-- Modem -->
    <rect x="50" y="280" width="140" height="60" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="6"/>
    <text x="120" y="305" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
          text-anchor="middle" font-weight="600">Modem</text>
    <text x="60" y="325" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Network data
    </text>

    <!-- Storage -->
    <rect x="210" y="280" width="140" height="60" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="6"/>
    <text x="280" y="305" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
          text-anchor="middle" font-weight="600">Storage</text>
    <text x="220" y="325" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      Disk I/O
    </text>

    <!-- Memory -->
    <rect x="370" y="280" width="140" height="60" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="6"/>
    <text x="440" y="305" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
          text-anchor="middle" font-weight="600">Memory</text>
    <text x="380" y="325" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
      RAM access
    </text>
  </g>

  <!-- Arrows from sources to crypto unit -->
  <path d="M 120 275 L 360 245" stroke="#32ff00" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-green)"/>
  <path d="M 280 275 L 390 245" stroke="#32ff00" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-green)"/>
  <path d="M 440 275 L 440 245" stroke="#32ff00" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-green)"/>

  <text x="250" y="270" font-family="'IBM Plex Serif', serif" font-size="10" fill="#8b949e"
        font-style="italic">All data routes through crypto unit</text>

  <!-- DMA controller -->
  <rect x="570" y="100" width="180" height="140" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="660" y="130" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        text-anchor="middle" font-weight="600">DMA Engine</text>
  <text x="580" y="160" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Zero CPU overhead
  </text>
  <text x="580" y="180" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    Crypto runs
  </text>
  <text x="580" y="200" font-family="'IBM Plex Serif', serif" font-size="12" fill="#8b949e">
    independently
  </text>

  <!-- Arrow from crypto to DMA -->
  <path d="M 555 170 L 565 170" stroke="#ffaa00" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Kill-switch integration -->
  <rect x="570" y="280" width="180" height="60" fill="#1f2937" stroke="#ff3232" stroke-width="2" rx="6"/>
  <text x="660" y="305" font-family="'Oxanium', sans-serif" font-size="15" fill="#ff3232"
        text-anchor="middle" font-weight="600">Kill-Switch</text>
  <text x="580" y="325" font-family="'IBM Plex Serif', serif" font-size="11" fill="#8b949e">
    Zeroes CSRs + Crypto Unit
  </text>

  <!-- Arrow from kill-switch to CSRs and Crypto -->
  <path d="M 570 310 L 235 190" stroke="#ff3232" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 570 310 L 470 245" stroke="#ff3232" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Performance comparison -->
  <rect x="50" y="380" width="800" height="190" fill="#1f2937" rx="8" opacity="0.9"/>

  <text x="60" y="410" font-family="'Oxanium', sans-serif" font-size="18" fill="#32ff00"
        font-weight="600">Performance Comparison</text>

  <!-- Software ChaCha20 -->
  <text x="60" y="440" font-family="'Oxanium', sans-serif" font-size="15" fill="#ff3232"
        font-weight="600">Software ChaCha20 (CPU)</text>
  <rect x="60" y="450" width="250" height="20" fill="#ff3232" opacity="0.3" rx="4"/>
  <text x="320" y="465" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#ff3232">
    ~250 MB/s
  </text>

  <!-- Modern CPU -->
  <text x="60" y="495" font-family="'Oxanium', sans-serif" font-size="15" fill="#ffaa00"
        font-weight="600">Modern CPU (optimized)</text>
  <rect x="60" y="505" width="400" height="20" fill="#ffaa00" opacity="0.3" rx="4"/>
  <text x="470" y="520" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#ffaa00">
    ~3-4 GB/s per core
  </text>

  <!-- Hardware coprocessor -->
  <text x="60" y="550" font-family="'Oxanium', sans-serif" font-size="15" fill="#32ff00"
        font-weight="600">Hardware Coprocessor (ferros)</text>
  <rect x="60" y="560" width="780" height="20" fill="#32ff00" opacity="0.3" rx="4"/>
  <text x="840" y="575" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#32ff00"
        font-weight="600">
    64 GB/s (faster than RAM bandwidth!)
  </text>
</svg>
