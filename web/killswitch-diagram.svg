<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#32ff00"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff3232"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#0a0e13"/>

  <!-- Title -->
  <text x="500" y="35" font-family="'Oxanium', sans-serif" font-size="26" font-weight="300"
        fill="#32ff00" text-anchor="middle" filter="url(#glow)">
    0ms Kill-Switch Architecture
  </text>

  <!-- Timeline -->
  <line x1="100" y1="250" x2="900" y2="250" stroke="#32ff00" stroke-width="2" opacity="0.3"/>

  <!-- Kill-switch press -->
  <rect x="80" y="180" width="120" height="140" fill="#1f2937" stroke="#ff3232" stroke-width="2" rx="8"/>
  <text x="140" y="210" font-family="'Oxanium', sans-serif" font-size="16" fill="#ff3232"
        text-anchor="middle" font-weight="600">KILL</text>
  <text x="140" y="230" font-family="'Oxanium', sans-serif" font-size="16" fill="#ff3232"
        text-anchor="middle" font-weight="600">SWITCH</text>
  <circle cx="140" cy="270" r="25" fill="none" stroke="#ff3232" stroke-width="3"/>
  <text x="140" y="310" font-family="'IBM Plex Mono', monospace" font-size="12"
        fill="#8b949e" text-anchor="middle">t=0ms</text>

  <!-- Hardware cutoff -->
  <rect x="250" y="180" width="140" height="140" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="320" y="210" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
        text-anchor="middle">Hardware</text>
  <text x="320" y="230" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
        text-anchor="middle">Power</text>
  <text x="320" y="250" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
        text-anchor="middle">Cutoff</text>
  <path d="M 300 270 L 340 270" stroke="#ff3232" stroke-width="4" stroke-linecap="round"/>
  <circle cx="310" cy="270" r="6" fill="#ff3232"/>
  <circle cx="330" cy="270" r="6" fill="#ff3232"/>
  <text x="320" y="310" font-family="'IBM Plex Mono', monospace" font-size="12"
        fill="#8b949e" text-anchor="middle">t=0ms</text>

  <!-- CSR zeroing -->
  <rect x="440" y="180" width="140" height="140" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="510" y="210" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
        text-anchor="middle">CSR Keys</text>
  <text x="510" y="230" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
        text-anchor="middle">Zeroed</text>
  <rect x="480" y="245" width="60" height="35" fill="#0a0e13" stroke="#32ff00" stroke-width="1.5" rx="4"/>
  <text x="510" y="268" font-family="'IBM Plex Mono', monospace" font-size="18"
        fill="#32ff00" text-anchor="middle">0x00</text>
  <text x="510" y="310" font-family="'IBM Plex Mono', monospace" font-size="12"
        fill="#8b949e" text-anchor="middle">t=0ms</text>

  <!-- Memory cleared -->
  <rect x="630" y="180" width="140" height="140" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="700" y="210" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
        text-anchor="middle">Encrypted</text>
  <text x="700" y="230" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
        text-anchor="middle">Memory</text>
  <text x="700" y="250" font-family="'IBM Plex Serif', serif" font-size="14" fill="#32ff00"
        text-anchor="middle">Unreadable</text>
  <rect x="660" y="260" width="80" height="4" fill="#32ff00" opacity="0.3"/>
  <rect x="660" y="268" width="80" height="4" fill="#32ff00" opacity="0.3"/>
  <rect x="660" y="276" width="80" height="4" fill="#32ff00" opacity="0.3"/>
  <text x="700" y="310" font-family="'IBM Plex Mono', monospace" font-size="12"
        fill="#8b949e" text-anchor="middle">t=0ms</text>

  <!-- Complete -->
  <rect x="820" y="180" width="100" height="140" fill="#1f2937" stroke="#32ff00" stroke-width="2" rx="8"/>
  <text x="870" y="240" font-family="'Oxanium', sans-serif" font-size="18" fill="#32ff00"
        text-anchor="middle" font-weight="600">SECURE</text>
  <circle cx="870" cy="270" r="20" fill="none" stroke="#32ff00" stroke-width="3"/>
  <path d="M 860 270 L 867 277 L 880 264" fill="none" stroke="#32ff00" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="870" y="310" font-family="'IBM Plex Mono', monospace" font-size="12"
        fill="#8b949e" text-anchor="middle">t=0ms</text>

  <!-- Arrows -->
  <path d="M 205 250 L 245 250" stroke="#ff3232" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M 395 250 L 435 250" stroke="#32ff00" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 585 250 L 625 250" stroke="#32ff00" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 775 250 L 815 250" stroke="#32ff00" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Comparison box -->
  <rect x="50" y="360" width="900" height="120" fill="#1f2937" rx="8" opacity="0.8"/>

  <text x="60" y="385" font-family="'Oxanium', sans-serif" font-size="16" fill="#ff3232"
        font-weight="600">Traditional OS:</text>
  <text x="60" y="410" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    1. Request shutdown → 2. Close apps → 3. Flush buffers → 4. Update filesystem →
  </text>
  <text x="60" y="430" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    5. Sync disk → 6. Power down hardware
  </text>
  <text x="60" y="450" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#ff3232"
        font-weight="600">Time: 2-10 seconds</text>

  <text x="520" y="385" font-family="'Oxanium', sans-serif" font-size="16" fill="#32ff00"
        font-weight="600">ferros:</text>
  <text x="520" y="410" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    1. Hardware cutoff (physical circuit)
  </text>
  <text x="520" y="430" font-family="'IBM Plex Serif', serif" font-size="13" fill="#8b949e">
    Ring architecture = always valid state
  </text>
  <text x="520" y="450" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#32ff00"
        font-weight="600">Time: 0ms</text>
</svg>
