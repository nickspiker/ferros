<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#32ff00;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#32ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32ff00;stop-opacity:0.6" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0e13"/>

  <!-- Title -->
  <text x="400" y="40" font-family="'Oxanium', sans-serif" font-size="28" font-weight="300"
        fill="#32ff00" text-anchor="middle" filter="url(#glow)">
    Ring Memory Architecture
  </text>

  <!-- Main ring -->
  <circle cx="400" cy="320" r="180" fill="none" stroke="url(#ringGradient)"
          stroke-width="8" filter="url(#glow)"/>

  <!-- Process allocation segment -->
  <path d="M 400 140 A 180 180 0 0 1 550 380" fill="none" stroke="#ffaa00"
        stroke-width="12" opacity="0.5" stroke-linecap="round"/>

  <!-- Offset marker -->
  <circle cx="400" cy="140" r="8" fill="#32ff00" filter="url(#glow)"/>
  <text x="400" y="115" font-family="'IBM Plex Mono', monospace" font-size="16"
        fill="#32ff00" text-anchor="middle">offset (random)</text>
  <line x1="400" y1="125" x2="400" y2="132" stroke="#32ff00" stroke-width="1"/>

  <!-- Limit marker -->
  <circle cx="550" cy="380" r="8" fill="#ffaa00" filter="url(#glow)"/>
  <text x="550" y="410" font-family="'IBM Plex Mono', monospace" font-size="16"
        fill="#ffaa00" text-anchor="middle">offset + limit</text>
  <line x1="550" y1="388" x2="550" y2="395" stroke="#ffaa00" stroke-width="1"/>

  <!-- Process label -->
  <text x="500" y="240" font-family="'IBM Plex Mono', monospace" font-size="18"
        fill="#ffaa00" text-anchor="middle" font-weight="600">Process Space</text>

  <!-- Wraparound arrows -->
  <path d="M 575 200 Q 650 200 650 320" fill="none" stroke="#32ff00"
        stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <path d="M 225 200 Q 150 200 150 320" fill="none" stroke="#32ff00"
        stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#32ff00"/>
    </marker>
  </defs>

  <!-- No boundaries text -->
  <text x="650" y="320" font-family="'IBM Plex Serif', serif" font-size="14"
        fill="#8b949e" text-anchor="start">Wraps</text>
  <text x="650" y="340" font-family="'IBM Plex Serif', serif" font-size="14"
        fill="#8b949e" text-anchor="start">infinitely</text>

  <text x="150" y="320" font-family="'IBM Plex Serif', serif" font-size="14"
        fill="#8b949e" text-anchor="end">No</text>
  <text x="150" y="340" font-family="'IBM Plex Serif', serif" font-size="14"
        fill="#8b949e" text-anchor="end">boundaries</text>

  <!-- Code snippet box -->
  <rect x="50" y="470" width="700" height="110" fill="#1f2937" rx="8"/>

  <text x="60" y="495" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#c9d1d9">
    fn check_access(ptr: usize, offset: usize, limit: usize) -> bool {
  </text>
  <text x="80" y="520" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#32ff00">
    (ptr.wrapping_sub(offset)) &lt; limit
  </text>
  <text x="60" y="545" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#c9d1d9">
    }
  </text>
  <text x="60" y="570" font-family="'IBM Plex Serif', serif" font-size="12"
        fill="#8b949e" font-style="italic">
    2 CPU cycles. No page tables. No TLB. No segmentation faults.
  </text>
</svg>
