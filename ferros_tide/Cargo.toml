[package]
name = "ferros_tide"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The tide engine (docs/PUCKS.md): harmonic prediction from a station's 37 NOAA constituents with Schureman's nodal corrections, astronomical arguments from Eagle time, and the highs and lows by root finding on the rate. no_std, host-tested against NOAA's published predictions."

[lib]
path = "src/lib.rs"

[dependencies]
libm = "0.2"
