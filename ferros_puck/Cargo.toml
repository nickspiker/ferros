[package]
name = "ferros_puck"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pucks (docs/PUCKS.md): the list of drawing ops a puck sends the display for its circle, written by the puck and checked and drawn by the display, front to back with under. no_std, libm."

[lib]
path = "src/lib.rs"

[dependencies]
libm = "0.2"
# The puck's side on the device (`rt`): its calls to the display, its view's doorbell, Eagle time from the kernel's clock.
ferros_sys = { path = "../ferros_sys", optional = true }

[features]
sys = ["dep:ferros_sys"]
