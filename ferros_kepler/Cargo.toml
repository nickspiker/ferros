[package]
name = "ferros_kepler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The 8a's GNSS (the Samsung KEPLER core of its S5300 modem) as its SPI link carries it (docs/GPS.md \"akita's KEPLER\"): CHPP's transport (preamble, header, CRC-32, acks, fragments), its app layer (discovery, timesync, the BETP service's open), and Samsung's BETP records inside it. no_std, no allocation, host-tested against the 2026-11-18 captures."

[lib]
path = "src/lib.rs"
