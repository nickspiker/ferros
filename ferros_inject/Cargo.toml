[package]
name = "ferros_inject"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Input injection scripts (docs/INPUT-INJECT.md): fingers and keys in shown frames, as a complete VSF document with its schema, built by ferros-bridge and checked again by the inject process on the device. Needs a heap."

[lib]
path = "src/lib.rs"

[dependencies]
vsf = { path = "../../vsf", default-features = false }
