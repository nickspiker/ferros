[package]
name = "ferros_gnss"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The GNSS sky before a lock (docs/GPS.md \"Predicted birds\"): GP elements (CelesTrak's two-line form) read with their checksums, every GPS, GLONASS, Galileo and BeiDou satellite carried forward from its elements' epoch, its azimuth and elevation from a place at a time, and the rough place itself combined from several sources (the single egg rule). no_std, libm, host-tested against an independent GPS almanac."

[lib]
path = "src/lib.rs"

[dependencies]
libm = "0.2"
# Eagle time, the days from J2000 and a place on the earth: the sun and moon engine's own conventions, so a satellite and the sun are placed by one clock.
ferros_sky = { path = "../sky" }
