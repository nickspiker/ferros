[package]
name = "ferros_compass"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The compass puck's engine (docs/PUCKS.md): tilt-compensated magnetic heading from the magnetometer and gravity, a hard-iron calibration, and true north from the World Magnetic Model's declination. no_std, libm, host-tested against NOAA's WMM test values."

[lib]
path = "src/lib.rs"

[dependencies]
libm = "0.2"
