[package]
name = "ferros_weather"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The weather puck's document (docs/PUCKS.md): the small VSF forecast fgtw.org serves for a place rounded to about 10 km, read on the device by name and type marker. no_std + alloc."

[lib]
path = "src/lib.rs"

[dependencies]
vsf = { path = "../../../vsf", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure"] }
# The cell grid's cos and rounding: libm's software maths, so fgtw.org's copy (also libm) computes the same columns bit for bit.
libm = "0.2"
