[package]
name = "ferros_mailbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mailboxes (docs/KERNEL.md \"Mailboxes\"; owner, 2026-11-19): one writer publishes into a frame of words under a seqlock, any number of readers map it read-only and read without calling the writer. The header, the seqlock's publish and its consistent read, and each mailbox's payload layout. no_std, no dependencies; host-tested."

[lib]
path = "src/lib.rs"
