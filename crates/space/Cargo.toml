[package]
name = "ferros_space"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The person's identity space on ferros (docs/IDENTITY-SPACE.md): what of theirs follows them to every device of their fleet (the kists they stowed and their answers, their permission defaults, the arrangement of their deck and the view, each device's deck sync switch), as fgtw::space facts, and the sync that joins a device's own copy (kists.list, map.place.*, map.view) to them. no_std; the identity service (payloads/fgtw) runs it."

[lib]
path = "src/lib.rs"

[dependencies]
# `profile`: the people (fgtw::people), whose names are VSF text, with the text codec it brings without std.
fgtw = { path = "../../../fgtw", default-features = false, features = ["profile"] }
vsf = { path = "../../../vsf", default-features = false }
ferros_kist = { path = "../kist" }
# The device copy's documents (the map's places and view), one definition with the map.
ferros_kept = { path = "../kept" }

[dev-dependencies]
# The map's old forms (EWE runs) built exactly as the old map wrote them, for the tests that an old copy never reads as a removal.
ferros_ledger = { path = "../ledger" }
# The host test seals and opens the space between two vaults as the devices do (the seal is fgtw's `fanout`, its nonce the OS's with `std`).
fgtw = { path = "../../../fgtw", default-features = false, features = ["std", "fanout"] }
# The deck document's circles named as the map names them.
ferros_thing = { path = "../thing" }
