[package]
name = "ferros_glass"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The glass console: text straight onto whatever buffer the panel scans, for when nothing else can put it there (a kernel panic, a process that died with the display, a boot that stalled). The 8x16 bitmap font with tatau's dozenal digits, radix point and sign arrows rasterised from Oxanium +glyphs at build time, numbers in the device's base, word wrap at the screen's width, manual line returns, line by line down to the bottom. No allocation, no locks, no panic on any input. no_std."

[lib]
path = "src/lib.rs"

[dependencies]
# Numbers in the device's base (SETTINGS.md "The number base"): `Num` writes a line's numbers for the person with tatau, and as `A#`/`G#` for the developer.
tatau = { path = "../../../tatau" }

[build-dependencies]
# The dozenal cells (build.rs), from the face and with the rasteriser the kernel's text atlas uses.
fontdue = "0.9"
