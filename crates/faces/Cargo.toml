[package]
name = "ferros_faces"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The faces of ferros's own pucks (docs/PUCKS.md): tide, sun, moon, compass, GPS and weather, each its engine's values written as a ferros_puck list of ops, at rest and in focus. no_std, host-tested for every list's size and shape."

[lib]
path = "src/lib.rs"

[dependencies]
libm = "0.2"
ferros_puck = { path = "../puck" }
# The typeface the tide face draws its own words in (it paints its square per pixel, as the clock does).
ferros_glyphs = { path = "../glyphs" }
ferros_tide = { path = "../tide" }
ferros_sky = { path = "../sky" }
ferros_compass = { path = "../compass" }
ferros_weather = { path = "../weather" }
