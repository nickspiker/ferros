[package]
name = "ferros_items"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The hold's items (docs/STORE.md): a card per item, the cards in time pages under a root, bodies as ferros_store values or single-copy clip extents, found by kind, maker, time, words and attributes. no_std + alloc, over ferros_store; the vault process serves it, host-tested here."

[dependencies]
ferros_store = { path = "../store" }
manifestus = { path = "../../../manifestus", default-features = false }
# x-full: titles and kists' names are `x`, words a person reads in any script.
vsf = { path = "../../../vsf", default-features = false, features = ["x-full"] }
blake3 = { version = "1", default-features = false, features = ["pure"] }
# An item's id is a thing (`ht`), minted once (ferros_thing `hold_item`).
ferros_thing = { path = "../thing" }

[dev-dependencies]
# The kinds' ids checked against their first phrasings (IDEAS.md), as ferros_idea mints them.
ferros_idea = { path = "../idea" }

[lints.rust]
# `kist::Sys` on the device's targets: payloads (`none`) and std kists (`ferros`).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("ferros"))'] }
