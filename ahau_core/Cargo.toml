[package]
name = "ahau_core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "ahau's identity derivation without std: a handle typed on the honeycomb keyboard to vsf's x bytes (byte-exact with vsf 0.11, the codebook ihi hashes with, for every character the keyboard has) and its BLAKE3 (ihi's identity seed)"

[dependencies]
blake3 = { version = "1", default-features = false }

[dev-dependencies]
vsf = { version = "0.11", path = "../../vsf", default-features = false, features = ["text-encode"] }
ihi = { path = "../../ihi" }

# The encoder table is generated from the keyboard and the frozen codebook (build.rs).
[build-dependencies]
honeycomb = { path = "../honeycomb" }
blake3 = "1"
unicode-normalization = "0.1"
