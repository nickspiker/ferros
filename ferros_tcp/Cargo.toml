[package]
name = "ferros_tcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The pure parts of the ip process's client TCP (payloads/ip): sequence arithmetic, the out-of-order ranges, option parsing and building (MSS, window scale, SACK), the receive window, the RTT estimator and NewReno congestion control. no_std, no I/O, tested on the host."

[lib]
path = "src/lib.rs"
