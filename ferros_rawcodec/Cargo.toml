[package]
name = "ferros_rawcodec"
version = "0.1.0"
edition = "2024"
description = "The lossless band codec for 10-bit camera RAW mosaics, format Zil: no_std, no alloc, its bitstream specified in src/lib.rs"

[workspace]

[lib]
name = "ferros_rawcodec"
path = "src/lib.rs"

[features]
# Hand-written NEON for the residual, block-sum and code steps on aarch64; the scalar path is the reference and the default.
neon = []

[dependencies]

[dev-dependencies]
raw-codec = { path = "../tools/raw-codec" }

[profile.release]
debug = 1
codegen-units = 1
