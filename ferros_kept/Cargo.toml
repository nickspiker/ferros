[package]
name = "ferros_kept"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What the payload processes keep in the vault, each value one complete VSF document (docs/VSF-AUDIT.md wave 0: P15, P17, P18, P19): the GPS driver's last fix, the map's places, view and Developer switch, the identity's 32-byte secrets, the sponsor placed by hand. no_std; needs a heap in the process, so it stays out of ferros_sys; host-tested."

[lib]
path = "src/lib.rs"

[dependencies]
vsf = { path = "../../vsf", default-features = false }
# vsf hashes with blake3; pure Rust, as the display has it: its C and assembly do not build for the bare target.
blake3 = { version = "1", default-features = false, features = ["pure"] }
# The last fix's degrees thru vsf's position type (a rounding without std).
libm = "0.2"
