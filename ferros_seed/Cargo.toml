[package]
name = "ferros_seed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ferros trust anchor — self-verify, find kernel, verify kernel, jump"

[[bin]]
name = "ferros_seed"
path = "src/main.rs"

[dependencies]
ferros_layout = { path = "../ferros_layout" }
ferros_hal = { path = "../ferros_hal", default-features = false }
vsf = { path = "../../vsf", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure"] }
ed25519-compact = { version = "2", default-features = false }
ihi = { version = "0.0.3", default-features = false }
