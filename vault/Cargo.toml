[package]
name = "ferros_vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The persistent object store that ferros boots from and operates on"

[dependencies]
blake3 = { version = "1", default-features = false, features = ["pure"] }
vsf = { version = "0.4", default-features = false, features = ["crypto"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"], optional = true }
# XChaCha20-Poly1305 AEAD, no_std (alloc-only). Non-optional: the store encrypts object/index payloads on every path, host and on-device alike (see src/crypto.rs).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
voca = { version = "0.0.0", optional = true }
num-bigint = { version = "0.4", optional = true }

[features]
default = ["std"]
std = ["blake3/std"]
alloc = []  # enables Vec/String via extern crate alloc
# Linux single-file vault backend: stores the entire object store + anchor ring inside one VSF-wrapped file. Pulls in `std`, the vsf crate (for the outer wrapper), `chacha20poly1305` (per-key encryption of payload bytes before hashing), and `rand` (random sibling-tmp filenames for atomic rename + nonce generation), and `voca`/`num-bigint` (vaultinfo accepts voca-encoded keys alongside hex). Provides PermissiveCapabilityEngine + SingleDeviceMeshEngine stubs so Photon's Ledger compiles with the same type signature it will use on real ferros hardware later.
host-file = ["std", "alloc", "dep:rand", "dep:voca", "dep:num-bigint"]

# Binary inspector for vault files. Companion to vsfinfo: vsfinfo shows the outer VSF wrapper, vaultinfo decodes the inner vault structure (anchors, object envelopes, root_commit). Lives here (not in vsf) because the inspector knows ferros_vault's binary format and vsf already depends on nothing that pulls this in.
[[bin]]
name = "vaultinfo"
path = "src/bin/vaultinfo.rs"
required-features = ["host-file"]

[dev-dependencies]
