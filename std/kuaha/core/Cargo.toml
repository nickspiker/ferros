[package]
name = "kuaha_core"
version = "0.1.0"
edition = "2021"
description = "Kūaha without a platform: the hold's items found by kind, time, maker and words, each a card to open or remove, and the device's totals, drawn with fluor; the hold reached thru a HoldSource, so the same core runs as the kist on ferros (std/kuaha) and later on a desktop that reaches the person's devices (docs/KISTS.md \"Kūaha\")."
license = "Apache-2.0"

[dependencies]
# Drawing and text only: the window is the platform's (fluor's ferros host on the device, its winit host on a desktop later).
fluor = { path = "../../../../fluor", default-features = false, features = ["std", "text", "simd"] }
# The hold's own types (the card, a find, its answer) and the kist's calls over any transport (docs/HOLD-API.md).
ferros_items = { path = "../../../ferros_items" }
# Every word in the person's language, every number in their base.
ferros_lang = { path = "../../../ferros_lang" }
tatau = { path = "../../../../tatau" }
# Kūaha's own choices, a complete VSF document (its view and its find), and Eagle time.
vsf = { path = "../../../../vsf", default-features = false, features = ["x-full"] }

[dev-dependencies]
# The hold's server over a RAM vault and clips area, as ferros_items's own tests run it: Kūaha's tests talk to the real thing.
ferros_store = { path = "../../../store" }
manifestus = { path = "../../../../manifestus", default-features = false }
blake3 = "1"
# The screens written as VSF visuals (the house image format) for the owner to look at.
vsf = { path = "../../../../vsf" }
