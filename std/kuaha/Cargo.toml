[package]
name = "kuaha-ferros"
version = "0.1.0"
edition = "2021"
description = "Kūaha on ferros as a kist: its core (std/kuaha/core: the hold's items found, opened and removed, the device's totals) under fluor's ferros host, the hold reached thru the kist's own `items` grant (docs/KISTS.md \"Kūaha\", tools/kuaha-build.sh)."
license = "Apache-2.0"

[[bin]]
name = "kuaha"
path = "src/main.rs"

[dependencies]
kuaha_core = { path = "core" }
ferros_items = { path = "../../ferros_items" }
ferros_lang = { path = "../../ferros_lang" }
tatau = { path = "../../../tatau" }
vsf = { path = "../../../vsf", default-features = false, features = ["x-full"] }

[target.'cfg(target_os = "ferros")'.dependencies]
fluor = { path = "../../../fluor", default-features = false, features = ["host-ferros", "simd"] }
# The kist's own vault domain: Kūaha's choices (its view and its find), no files on ferros.
kete = { path = "../../../kete" }
# getrandom 0.2 through any dependency: its `custom` backend is ferros_rt's, the kernel's entropy (the kist's entropy right).
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }

[profile.release]
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace]
members = ["core"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("ferros"))'] }
