[package]
name = "photon-ferros"
version = "0.1.0"
edition = "2024"
description = "Photon on the phone as a ferros process: Photon's library under fluor's ferros host, with this build's own lockfile and patch table so Photon's manifest, lock and cargo config stay as its desktop and Android builds want them (STD-TARGET.md; tools/photon-build.sh)"

[[bin]]
name = "photon"
path = "src/main.rs"

[dependencies]
photon-messenger = { path = "../../../photon" }
fluor = { path = "../../../fluor", default-features = false, features = ["host-ferros", "simd", "emoji"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
# fgtw itself, the same copy Photon builds against (`../../../fgtw`, Photon's `../fgtw`): the alias's keys (fgtw::alias), the binding (fgtw::binding) and the people (fgtw::people) of the facets (docs/FACETS.md). Needs fgtw with those modules (its `facets` branch until merged).
fgtw = { path = "../../../fgtw", default-features = false, features = ["sign", "profile"] }

[patch.crates-io]
# libc with a ferros arm: the C scalar types, no functions, for the crates that spell their types through it (pqcrypto-internals, rav1d).
libc = { path = "/mnt/Harbor/Code/ferros-libc" }

[profile.dev]
panic = "abort"
opt-level = 1

# The dependencies at full optimisation (fluor's rasterizers and composes, cosmic-text and swash's shaping and glyphs: every pixel of a frame runs through them), Photon's own code at the development level above so its relink stays quick (2026-11-08: at opt-level 1 the frame's full-screen passes took 10 to 30 ms each on the A715s).
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Photon's own code at 1, measured 2026-11-13 on the 8a (docs/PHOTON.md "Photon's frame time"): at 3 the attest screen's scroll frame rendered in 65 ms against 68, and in 370 ms against 382 before the wave's fix, for about 25 s more a build.
[profile.dev.package.photon-messenger]
opt-level = 1

[profile.release]
panic = "abort"

[workspace]
