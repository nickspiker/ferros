[package]
name = "photon-ferros"
version = "0.1.0"
edition = "2024"
description = "Photon on the phone as a ferros process: Photon's library under fluor's ferros host, with this build's own lockfile and patch table so Photon's manifest, lock and cargo config stay as its desktop and Android builds want them (STD-TARGET.md; tools/photon-build.sh)"

[[bin]]
name = "photon"
path = "src/main.rs"

[dependencies]
photon-messenger = { path = "../../../photon" }
fluor = { path = "../../../fluor", default-features = false, features = ["host-ferros", "simd", "emoji"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }

[patch.crates-io]
# libc with a ferros arm: the C scalar types, no functions, for the crates that spell their types through it (pqcrypto-internals, rav1d).
libc = { path = "/mnt/Harbor/Code/ferros-libc" }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"

[workspace]
