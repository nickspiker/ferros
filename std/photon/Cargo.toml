[package]
name = "photon-ferros"
version = "0.1.0"
edition = "2024"
description = "Photon on the phone as a ferros process: Photon's library under fluor's ferros host, with this build's own lockfile and patch table so Photon's manifest, lock and cargo config stay as its desktop and Android builds want them (STD-TARGET.md; tools/photon-build.sh)"

[[bin]]
name = "photon"
path = "src/main.rs"

[dependencies]
photon-messenger = { path = "../../../photon" }
fluor = { path = "../../../fluor", default-features = false, features = ["host-ferros", "simd", "emoji"] }
# fluor's ferros host in the person's app scale and the device's theme, following both (owner 2026-11-20).
ferros_fluor = { path = "../../ferros_fluor" }
# The device's number base and language (preference 0 and the language block), which Photon follows on ferros (`numerals`): the person's identity preference reaches the device (settings flow identity to device only), and apps follow the device (owner, 2026-11-22).
ferros_sys = { path = "../../ferros_sys" }
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
# The alias's bundle kept sealed in Photon's domain (main.rs `alias_cache`): the AEAD Photon's at-rest layer uses and the VSF document it is kept in, the same versions Photon builds against.
chacha20poly1305 = "0.11.0-rc.2"
vsf = { path = "../../../vsf" }
# fgtw itself, the same copy Photon builds against (`../../../fgtw`, Photon's `../fgtw`): the alias's keys (fgtw::alias), the binding (fgtw::binding) and the people (fgtw::people) of the facets (docs/FACETS.md). fgtw main since 47ed633.
fgtw = { path = "../../../fgtw", default-features = false, features = ["sign", "profile"] }
# The CPU's SHA-256 for every sha2 0.10 in the graph (fips205's SPHINCS+ above all), by feature unification: on aarch64 sha2 0.10 takes its own intrinsic backend only with `asm`, and without it every SHA-256 here ran in software (2026-11-17, the Pro's X3: SPHINCS+ keygen 208 ms to 36, a signature 1841 to 313; Photon's device and alias keys were each about 98 % SPHINCS+ keygen).
# `asm` also builds sha2-asm's sha256_aarch64.S with the cross gcc (std processes may link C and assembly); that file uses none of x24 to x28 and is never referenced, since sha2 0.10's aarch64 path is its Rust intrinsics.
sha2 = { version = "0.10", default-features = false, features = ["asm"] }

[patch.crates-io]
# libc with a ferros arm: the C scalar types, no functions, for the crates that spell their types through it (pqcrypto-internals, rav1d).
libc = { path = "/mnt/Harbor/Code/ferros-libc" }

[profile.dev]
panic = "abort"
opt-level = 1

# The dependencies at full optimisation (fluor's rasterizers and composes, cosmic-text and swash's shaping and glyphs: every pixel of a frame runs through them), Photon's own code at the development level above so its relink stays quick (2026-11-08: at opt-level 1 the frame's full-screen passes took 10 to 30 ms each on the A715s).
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Photon's own code at 3 without debug assertions or overflow checks, as its dependencies (2026-11-22, for the promo: the Photon session saw 77 to 136 ms renders on the Pro). On 2026-11-13 on the 8a (docs/PHOTON.md "Photon's frame time") opt-level 3 alone gave 65 ms against 68 for about 25 s more a build; the assertions and overflow checks were on then too.
[profile.dev.package.photon-messenger]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"

[workspace]
