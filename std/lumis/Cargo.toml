[package]
name = "lumis-ferros"
version = "0.2.10"
edition = "2021"
description = "Lumis on ferros as a kist: Lumis's own core (lumis_core: the menu, the integrator, the camera UI, the VSF saves) under fluor's ferros host, its platform layer here (the window and touch from fluor, frames and controls from the camera endpoint, its choices and saves in the kist's vault). Lumis's Android build is the rest of the Lumis repository; this crate is to it what the Kotlin app is there (docs/CAMERA.md, tools/lumis-build.sh)."

[[bin]]
name = "lumis"
path = "src/main.rs"

[dependencies]
# Lumis itself, without its JNI layer (Android's).
lumis_core = { path = "../../../lumis/rust", default-features = false }
fluor = { path = "../../../fluor", default-features = false, features = ["host-ferros", "simd"] }
# The camera list is a VSF document (docs/CAMERA.md, op LIST), and the display's pixel code is VSF's g2t.
vsf = { path = "../../../vsf" }
# The kist's own vault domain: Lumis's settings and its saves (no files on ferros).
kete = { path = "../../../kete" }
log = "0.4"
rayon = "1"
# getrandom 0.2 through any dependency: its `custom` backend is ferros_rt's, the kernel's entropy (the kist's entropy right).
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }

[profile.release]
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("ferros"))'] }
