[package]
name = "stdhello"
version = "0.1.0"
edition = "2024"
description = "The first std program on ferros: println, thread-locals, threads across the cores, Mutex and Condvar, Instant, sleep, HashMap, SystemTime (STD-TARGET.md)"

[[bin]]
name = "stdhello"
path = "src/main.rs"

[profile.release]
opt-level = 2
debug = false
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

[workspace]
