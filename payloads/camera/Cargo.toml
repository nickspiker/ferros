[package]
name = "ferros-payload-camera"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "camera"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../crates/sys" }
ferros_heap = { path = "../../crates/heap", features = ["process"] }
# `list`: the endpoint's list built from each camera's IDT in the vault (ferros_cam list).
ferros_cam = { path = "../../crates/cam", features = ["list"] }
# vsf hashes with blake3; pure Rust, as the display's and the vault's have it: its C and assembly do not build for the bare target.
blake3 = { version = "1", default-features = false, features = ["pure"] }
ferros_layout = { path = "../../crates/layout" }
