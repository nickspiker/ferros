[package]
name = "ferros-payload-kists"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kists"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
ferros_heap = { path = "../../ferros_heap" }
# Eagle time for a kist's install stamp (the person's list).
ferros_detail = { path = "../../ferros_detail" }
# The person's list (`process`), the directory (`directory`) and the fetch's pure half (`fetch`: HTTP decoding, a capsule taken in as it streams).
ferros_kist = { path = "../../ferros_kist", features = ["process", "directory"] }
# Every egg of a capsule checked against its developer's pinned bundle (fgtw's verify-only base, no_std + alloc).
fgtw = { path = "../../../fgtw", default-features = false }
