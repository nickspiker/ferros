[package]
name = "ferros-payload-ahau"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "ahau"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
honeycomb = { path = "../../honeycomb" }
# The attest screen's words in the person's language (ferros_lang; the fleet's and identity's are fgtw's, thru it), and its numbers in their base (tatau).
ferros_lang = { path = "../../ferros_lang", features = ["process"] }
tatau = { path = "../../../tatau" }
ahau_core = { path = "../../ahau_core" }
ihi = { path = "../../../ihi", default-features = false, features = ["proof"] }
blake3 = { version = "1", default-features = false, features = ["pure"] }
# The attest mark (tapuwae), without std: rows one after another on this thread, float maths from libm.
tapuwae = { path = "../../../tapuwae", default-features = false, features = ["gpu"] }
# VSF RGB's photopic luminance (through LMS), for the keys' rainbow: colours are VSF RGB, never sRGB (owner, 2026-11-01).
vsf = { version = "0.11", path = "../../../vsf", default-features = false }
# The attest button's squircle edge (a cube root) and the keys' hues (a cosine).
libm = "0.2"
