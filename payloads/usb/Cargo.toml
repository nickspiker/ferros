[package]
name = "ferros-payload-usb"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "usb"
path = "src/main.rs"

[features]
# As the kernel's: Microsoft OS 2.0 descriptors, so Windows reaches ferros with no driver (docs/FLASHER.md).
msos = ["ferros_hal/msos"]

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
ferros_pt = { path = "../../ferros_pt" }
ferros_hal = { path = "../../ferros_hal", default-features = false }
ferros_ledger = { path = "../../ferros_ledger" }
