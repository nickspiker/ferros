[package]
name = "ferros-payload-tidetest"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "tidetest"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../crates/sys" }
ferros_heap = { path = "../../crates/heap", features = ["process"] }
