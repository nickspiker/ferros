[package]
name = "ferros-payload-display"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "display"
path = "src/main.rs"

[dependencies]
tatau = { path = "../../../tatau" }
ferros_sys = { path = "../../ferros_sys" }
# The person's default wallpaper, a Julia set from their wallpaper seed (op 42).
wallpaper = { path = "../../wallpaper" }
# The radio circles' orbs, the maths tools/orb-tune tunes (console_draw).
orb = { path = "../../orb" }
# The person's own wallpaper, a VSF visual read from their space over the vault (main.rs `wall_own`).
vsf = { path = "../../../vsf", default-features = false }
# vsf hashes with blake3; pure Rust, as ahau has it: its C and assembly do not build for the bare target.
blake3 = { version = "1", default-features = false, features = ["pure"] }
ferros_dsi = { path = "../../ferros_dsi" }
# The boot modeset's DSC picture parameters (modeset.rs).
ferros_dsc = { path = "../../ferros_dsc" }
fluor = { path = "../../../fluor", default-features = false, features = ["host-bare"] }
# Text: swash in no_std (its libm feature), native f32 — outlines transformed before rasterising, so text turns at any angle (glyphs.rs). fontdue is gone.
swash = { version = "0.2.9", default-features = false, features = ["scale", "render", "libm"] }
libm = "0.2"

[build-dependencies]
# The ferros mark read from logo.vsf on the host into a table (build.rs, draw::logo).
vsf = { path = "../../../vsf" }
