[package]
name = "ferros-payload-display"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "display"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
ferros_dsi = { path = "../../ferros_dsi" }
fluor = { path = "../../../fluor", default-features = false, features = ["host-bare"] }
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
