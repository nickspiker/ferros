[package]
name = "ferros-payload-sensors"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "sensors"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
# The kernel's free-list allocator: the protocol builds and parses its messages on the heap, a few a second for as long as the session runs.
ferros_heap = { path = "../../ferros_heap" }
