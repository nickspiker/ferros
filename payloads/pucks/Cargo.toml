[package]
name = "ferros-payload-pucks"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# ferros's own pucks (docs/PUCKS.md), one capsule each, signed with the ferros project key (tools/pucks-kist.sh; memory kist_keys_follow_ownership: ferros is a commons).
[[bin]]
name = "puck_tide"
path = "src/tide.rs"

[[bin]]
name = "puck_sun"
path = "src/sun.rs"

[[bin]]
name = "puck_moon"
path = "src/moon.rs"

[[bin]]
name = "puck_compass"
path = "src/compass.rs"

[[bin]]
name = "puck_gps"
path = "src/gps.rs"

[[bin]]
name = "puck_weather"
path = "src/weather.rs"

[[bin]]
name = "puck_thermo"
path = "src/thermo.rs"

[[bin]]
name = "puck_battery"
path = "src/battery.rs"

[[bin]]
name = "puck_timer"
path = "src/timer.rs"

[dependencies]
ferros_sys = { path = "../../crates/sys" }
ferros_heap = { path = "../../crates/heap", features = ["process"] }
ferros_puck = { path = "../../crates/puck", features = ["sys"] }
# The typeface each puck draws its words in (the display's own).
ferros_glyphs = { path = "../../crates/glyphs" }
ferros_faces = { path = "../../crates/faces" }
ferros_tide = { path = "../../crates/tide", features = ["vsf"] }
ferros_sky = { path = "../../crates/sky" }
ferros_compass = { path = "../../crates/compass" }
ferros_weather = { path = "../../crates/weather" }
# The weather's POST to fgtw.org over the `ip` process: the response decoded as it arrives, as the stower's GET does (ferros_kist::fetch).
ferros_kist = { path = "../../crates/kist", features = ["process"] }
libm = "0.2"
# The compass's kept calibration and the timer's state, VSF documents in their own domains.
vsf = { path = "../../../vsf", default-features = false }
