[package]
name = "ferros-payload-map"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "map"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
# A link's detail document (docs/RADIO-CONTROLS.md).
ferros_detail = { path = "../../ferros_detail" }
# The heap the links' detail documents are read in (ferros_sys::detail, docs/RADIO-CONTROLS.md).
ferros_heap = { path = "../../ferros_heap" }
ferros_ledger = { path = "../../ferros_ledger" }
libm = "0.2"
tatau = { path = "../../../tatau" }
# Kists (KISTS.md): the person's list for the kist circles, the first-launch question and the permission pages.
ferros_kist = { path = "../../ferros_kist", features = ["process"] }
# The words on the settings pages in the person's language (Photon's sixteen; the fleet's words are fgtw's, thru it).
ferros_lang = { path = "../../ferros_lang", features = ["process"] }
# The kist circles' states as their glows (display op 57): the state's byte.
ferros_glow = { path = "../../ferros_glow" }
