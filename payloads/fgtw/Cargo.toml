[package]
name = "ferros-payload-fgtw"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "fgtw"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
ferros_heap = { path = "../../ferros_heap" }
photon_core = { path = "../../photon_core" }
fgtw = { path = "../../../fgtw", default-features = false, features = ["fanout", "protocol"] }
ed25519-dalek = { version = "2", default-features = false }
vsf = { path = "../../../vsf", default-features = false }
# The person's identity space (space.rs): ferros's vocabulary for fgtw::space and the sync with this device's copy.
ferros_space = { path = "../../ferros_space" }
