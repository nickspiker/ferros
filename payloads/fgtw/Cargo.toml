[package]
name = "ferros-payload-fgtw"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "fgtw"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
ferros_heap = { path = "../../ferros_heap" }
photon_core = { path = "../../photon_core" }
fgtw = { path = "../../../fgtw", default-features = false, features = ["fanout", "protocol", "flow", "profile"] }
# Photon Transport names a frame by its BLAKE3 when it answers a send (depart.rs, route.rs): the same pure build photon_core takes.
blake3 = { version = "1", default-features = false, features = ["pure"] }
ed25519-dalek = { version = "2", default-features = false }
# x-full: the `x` text codec without std for every Unicode scalar value (fgtw's Cargo.toml: a no_std build that wants every character enables vsf/x-full; the owner's call for ferros, so every language's text encodes, as ferros_idea does).
# Without a codec a kept departure or add holding a device's name (`x`) did not read ("VsfType::x is Huffman-coded and requires the 'text' feature"), so fgtw started fresh at every start, and a name it wrote flattened empty.
vsf = { path = "../../../vsf", default-features = false, features = ["x-full"] }
# The person's identity space (space.rs): ferros's vocabulary for fgtw::space and the sync with this device's copy.
ferros_space = { path = "../../ferros_space" }
