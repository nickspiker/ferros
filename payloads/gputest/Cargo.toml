[package]
name = "ferros-payload-gputest"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "gputest"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
valhall = { path = "../../valhall", features = ["ssa"] }
tapuwae = { path = "../../../tapuwae", default-features = false, features = ["gpu"] }
# tapuwae hashes with blake3: its pure-Rust build, as ahau takes it (no C on the payload target).
blake3 = { version = "1", default-features = false, features = ["pure"] }
