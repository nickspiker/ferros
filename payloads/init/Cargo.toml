[package]
name = "ferros-payload-init"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "init"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
# Kists (KISTS.md): the person's list read to launch one with exactly its granted rights; a heap to read it in.
ferros_kist = { path = "../../ferros_kist", features = ["process"] }
ferros_heap = { path = "../../ferros_heap" }
