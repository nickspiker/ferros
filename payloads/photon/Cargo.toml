[package]
name = "ferros-payload-photon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "photon"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
ferros_heap = { path = "../../ferros_heap" }
photon_core = { path = "../../photon_core" }
fgtw = { path = "../../../fgtw", default-features = false, features = ["fanout", "protocol"] }
ed25519-dalek = { version = "2", default-features = false }
vsf = { path = "../../../vsf", default-features = false }
