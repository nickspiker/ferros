[package]
name = "ferros-payload-wallgen"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "wallgen"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
ferros_heap = { path = "../../ferros_heap" }
wallpaper = { path = "../../wallpaper" }
vsf = { path = "../../../vsf", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure"] }
