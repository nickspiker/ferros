[package]
name = "ferros-payload-wallgen"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "wallgen"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../crates/sys" }
ferros_heap = { path = "../../crates/heap", features = ["process"] }
# The picture as GPU kernels (its `gpu` feature: valhall's recorder), wallgen's only way to draw it.
wallpaper = { path = "../../crates/wallpaper", features = ["gpu"] }
vsf = { path = "../../../vsf", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure"] }
# The made wallpaper's key kept as a VSF document (docs/VSF-AUDIT.md P18).
ferros_kept = { path = "../../crates/kept" }
