[package]
name = "ferros-payload-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
ferros_heap = { path = "../../ferros_heap" }
ferros_store = { path = "../../store" }
manifestus = { path = "../../../manifestus", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure"] }
vsf = { path = "../../../vsf", default-features = false }
