[package]
name = "ferros-payload-inject"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "inject"
path = "src/main.rs"

[dependencies]
ferros_sys = { path = "../../ferros_sys" }
ferros_heap = { path = "../../ferros_heap" }
ferros_inject = { path = "../../ferros_inject" }
# vsf hashes with blake3; pure Rust, as the display has it: its C and assembly do not build for the bare target.
blake3 = { version = "1", default-features = false, features = ["pure"] }
