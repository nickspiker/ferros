[package]
name = "ferros_kist"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kists (docs/KISTS.md): the rights a kist may want, its signed declaration in the capsule, and the person's list of installed kists with their answers, as VSF. Needs a heap; the kernel reads only the rights' names."

[lib]
path = "src/lib.rs"

[dependencies]
vsf = { path = "../../vsf", default-features = false }
# A version in the person's number base (`write_version`): the map's Kists page, the kist list kistcat writes. no_std, no dependencies; the kernel already links it.
tatau = { path = "../../tatau" }
# vsf hashes with blake3; pure Rust, as the display has it: its C and assembly do not build for the bare target.
blake3 = { version = "1", default-features = false, features = ["pure"] }
# The list read and written through a process's `kists.` grant (init, the map): only where ferros_sys's calls exist.
ferros_sys = { path = "../ferros_sys", optional = true }
# A capsule's developer bundle (`bundle`) and the kist directory (`directory`): its egg slots, and every egg checked against the project's pinned bundle, by fgtw's verify-only base (no_std + alloc, as payloads/fgtw builds it). Off for the kernel, init and the map, which read only the rights' names and the person's list.
fgtw = { path = "../../fgtw", default-features = false, optional = true }

[dev-dependencies]
# The directory's tests sign with a test key, as kistcat signs with the project's; the fetch's test signs a capsule with every egg of a test release bundle and checks the streamed hashes against fgtw's own verifier.
fgtw = { path = "../../fgtw", default-features = false, features = ["sign"] }

[features]
process = ["dep:ferros_sys"]
# A capsule's developer bundle (`kb`, every scheme's public key) read and written, and a capsule built the one way the bridge and kistcat both build it (`capsule`): fgtw's KeyBundle and egg slots.
bundle = ["dep:fgtw"]
# The kist directory (kists.fgtw.org/kists.vsf): its schema, built by tools/kistcat and read by the device's installer.
directory = ["bundle"]
