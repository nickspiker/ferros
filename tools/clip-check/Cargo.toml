[package]
name = "clip-check"
version = "0.1.0"
edition = "2021"
description = "A RAW clip pulled from a device read on the host (vsf visual::clip): every frame decoded and checked against the source hashes the recorder took of the frames as the camera wrote them (std/rawrec stores them as rawrec.hashes)"

[[bin]]
name = "clip-check"
path = "src/main.rs"

[dependencies]
vsf = { path = "../../../vsf", default-features = false, features = ["std"] }
ferros_clip = { path = "../../ferros_clip" }

[profile.release]
debug = 1

[workspace]
