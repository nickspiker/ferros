[package]
name = "ferros-flash-gui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The ferros installer people see: the welcome, the live device silhouette and the steps, a fluor window on the same library, signed release and run log as the ferros-flash CLI (docs/FLASHER.md, docs/BRAND.md)"

# Standalone, as tools/attest-mark and tools/tune are: fluor's host build (winit, cosmic-text, rayon, wgpu on macOS) stays out of the ferros workspace lock, and the CLI's executable stays small.
[workspace]

[[bin]]
name = "ferros-flash-gui"
path = "src/main.rs"

[dependencies]
# The engine: detection over nusb, the signed release, board manifests, the run log.
ferros-flash = { path = "../flash" }
fluor = { path = "../../../fluor", features = ["host-winit"] }
# The mark's analytic shapes (logo.vsf) drawn by vsf's own rasterizer, and the VSF screen capture (`--snap`).
vsf = { path = "../../../vsf", features = ["raster"] }
# Fetching the release and its files, and `send the log` (one POST to fgtw.org/report): rustls and the web's roots, as the CLI.
ureq = { version = "2", default-features = false, features = ["tls"] }

# fluor's own profiles, mirrored: profiles come from the binary's crate, and fluor's paint code relies on wrapping arithmetic (overflow checks off in both).
[profile.dev]
opt-level = 2
overflow-checks = false
debug = false
debug-assertions = false
incremental = true

[profile.release]
opt-level = 3
overflow-checks = false
lto = true
codegen-units = 1
strip = true
panic = "abort"
