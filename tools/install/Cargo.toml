[package]
name = "ferros-install"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Format and bootstrap a ferros partition from macOS"

[[bin]]
name = "ferros-install"
path = "src/main.rs"

[dependencies]
ferros_layout = { path = "../../crates/layout" }
# The spine and stem entries: one definition, the one the seed and the kernel read (portable on the host; its hardware modules are aarch64 only).
ferros_hal = { path = "../../crates/hal", default-features = false }
# The host's clock as Eagle time (std).
vsf = { path = "../../../vsf" }
blake3 = "1"
