[package]
name = "ferros-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host-side USB bridge daemon for ferros kernel communication"

[[bin]]
name = "ferros-bridge"
path = "src/main.rs"

[dependencies]
nusb = "0.1"
# The link and Photon Transport: tools/ferros-link, shared with ferros-send (its development vendor requests stay here, usb.rs).
ferros-link = { path = "../ferros-link" }
ferros_pt = { path = "../../ferros_pt", features = ["std"] }
blake3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "signal", "macros", "fs", "time"] }
nunc-time = "0.0.0"
# signed capsules for `spawn` (the kernel gate verifies them with vsf crypto-verify)
vsf = { path = "../../../vsf", features = ["crypto"] }
ed25519-dalek = "2"
# kists (KISTS.md): a capsule's declaration when it is signed (`bundle`: built the one way kistcat builds it, with its developer's bundle), the person's list when one is stowed
ferros_kist = { path = "../../ferros_kist", features = ["bundle"] }
# a kist capsule is signed with every scheme of its developer's bundle and checked at stow (fgtw::release: Photon's release key, owner 2026-11-10: "no single eggs")
fgtw = { path = "../../../fgtw", default-features = false, features = ["std", "sign"] }
# input injection scripts (docs/INPUT-INJECT.md): built here, played on the device by payloads/inject
ferros_inject = { path = "../../ferros_inject" }
