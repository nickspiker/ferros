[package]
name = "ferros-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host-side USB bridge daemon for ferros kernel communication"

[[bin]]
name = "ferros-bridge"
path = "src/main.rs"

[dependencies]
nusb = "0.1"
ferros_pt = { path = "../../ferros_pt", features = ["std"] }
blake3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "signal", "macros", "fs", "time"] }
