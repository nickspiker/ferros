[package]
name = "ferros-attest-mark"
version = "0.0.0"
edition = "2024"
publish = false
description = "The attest recognition mark on the desktop: type in the box and watch the device's Julia set answer, before it moves into ahau on the phone."

# Standalone: fluor's host build (winit, cosmic-text, rayon) stays out of the ferros workspace lock.
[workspace]

[dependencies]
fluor = { path = "../../../fluor", features = ["host-winit"] }
blake3 = "1"
rayon = "1"

# The mark is per-pixel iteration; an unoptimised build takes seconds a keystroke, so the development profile optimises this crate and its dependencies.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
