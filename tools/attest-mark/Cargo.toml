[package]
name = "ferros-attest-mark"
version = "0.0.0"
edition = "2024"
publish = false
description = "The attest recognition mark on the desktop: type in the box and watch the device's Julia set answer, before it moves into ahau on the phone."

# Standalone: fluor's host build (winit, cosmic-text, rayon) stays out of the ferros workspace lock.
[workspace]

[dependencies]
fluor = { path = "../../../fluor", features = ["host-winit"] }
blake3 = "1"
rayon = "1"

# fluor's own development profile, mirrored: profiles come from the binary's crate, not the dependency's, and fluor's paint code relies on wrapping arithmetic (its dev and release profiles both build with overflow checks off). The mark is per-pixel iteration, so the optimisation level matters too.
[profile.dev]
opt-level = 2
overflow-checks = false
debug = false
debug-assertions = false
incremental = true
