[workspace]
resolver = "3"
exclude = ["ferros_rt", "std/hello", "std/probe", "std/fluordemo", "std/photon"]
members = [
    "ferros_layout",
    "ferros_ext4",
    "ferros_f2fs",
    "ferros_kernel",
    "ferros_hv",
    "ferros_hal",
    "ferros_dsc",
    "ferros_dsi",
    "ferros_hal_m1",
    "vault",
    "ferros_ledger",
    "ferros_pt",
    "ferros_heap",
    "ferros_seed",
    "tools/mkimg",
    "tools/ferros-bridge",
    "tools/handle-guard",
    "tools/ferros-mask",
    "tools/install",
    "payloads/hello",
    "payloads/display",
    "payloads/shelltest",
    "payloads/fptest",
    "payloads/hello_el0",
    "payloads/echo_server",
    "payloads/touch",
    "payloads/gnss",
    "payloads/gnsstest",
    "payloads/focustest",
    "payloads/touchtest",
    "payloads/map",
    "payloads/init",
    "payloads/ramps",
    "payloads/hive",
    "payloads/ahau",
    "payloads/epcall",
    "payloads/keytest",
    "honeycomb",
    "ahau_core",
    "payloads/threads",
    "payloads/echo_client",
    "payloads/spinner",
    "payloads/pcie1",
    "ferros_sys",
    "ferros_sandbox",
    "photon_core",
    "payloads/ip",
    "payloads/nettest",
    "payloads/httptest",
    "payloads/photon",
    "payloads/pqprobe",
    "payloads/wxtest",
    "payloads/beamtest",
    "payloads/wdtfire",
    "payloads/usbprobe",
    "payloads/pmuprobe",
    "payloads/pmupoke",
    "payloads/repeaterprobe",
    "payloads/repeatertune",
    "payloads/dispprobe",
    "payloads/hangtest",
    "payloads/vendorprobe",
    "payloads/ufsfix",
    "payloads/slot1nop",
    "payloads/miscprobe",
    "payloads/ufsdump",
    "payloads/memprobe",
    "payloads/ufsinit2",
    "payloads/ufsreset",
    "payloads/ufsdme",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = "s"       # size-optimized for embedded
lto = true
codegen-units = 1
panic = "abort"

# The display server's per-pixel paths are measured for speed, not size (the ODT timing, 2026-10-24).
[profile.release.package.ferros-payload-display]
opt-level = 3
