[workspace]
resolver = "3"
exclude = ["ferros_rt", "std/hello", "std/probe", "std/fluordemo", "std/photon"]
members = [
    "ferros_layout",
    "ferros_ext4",
    "ferros_f2fs",
    "ferros_kernel",
    "ferros_hv",
    "ferros_hal",
    "ferros_dsc",
    "ferros_dsi",
    "ferros_hal_m1",
    "vault",
    "store",
    "ferros_ledger",
    "ferros_pt",
    "ferros_heap",
    "ferros_seed",
    "tools/mkimg",
    "tools/ferros-bridge",
    "tools/handle-guard",
    "tools/ferros-mask",
    "tools/install",
    "tools/flash",
    "payloads/hello",
    "payloads/stackprobe",
    "payloads/display",
    "payloads/shelltest",
    "payloads/fptest",
    "payloads/hello_el0",
    "payloads/echo_server",
    "payloads/touch",
    "payloads/gps",
    "payloads/nfc",
    "payloads/bt",
    "payloads/usb",
    "payloads/gpstest",
    "payloads/focustest",
    "payloads/clock",
    "payloads/touchtest",
    "payloads/map",
    "payloads/init",
    "payloads/ramps",
    "payloads/capture",
    "payloads/inject",
    "payloads/switchtest",
    "payloads/tecount",
    "payloads/gpu",
    "payloads/wintest",
    "payloads/gputest",
    "payloads/hive",
    "payloads/ahau",
    "payloads/epcall",
    "payloads/buftrap",
    "payloads/keytest",
    "honeycomb",
    "wallpaper",
    "orb",
    "ahau_core",
    "payloads/threads",
    "payloads/echo_client",
    "payloads/spinner",
    "payloads/pcie1",
    "ferros_sys",
    "ferros_kist",
    "ferros_lang",
    "ferros_tz",
    "ferros_space",
    "ferros_inject",
    "valhall",
    "ferros_sandbox",
    "photon_core",
    "payloads/ip",
    "payloads/modem",
    "payloads/sensors",
    "payloads/rmnetctl",
    "payloads/nettest",
    "payloads/httptest",
    "payloads/fgtw",
    "payloads/kists",
    "payloads/vault",
    "payloads/vaulttest",
    "payloads/wallgen",
    "payloads/pqprobe",
    "payloads/vaultbench",
    "payloads/wxtest",
    "payloads/beamtest",
    "payloads/wdtfire",
    "payloads/usbprobe",
    "payloads/pmuprobe",
    "payloads/pmupoke",
    "payloads/repeaterprobe",
    "payloads/repeatertune",
    "payloads/dispprobe",
    "payloads/hangtest",
    "payloads/vendorprobe",
    "payloads/ufsfix",
    "payloads/slot1nop",
    "payloads/miscprobe",
    "payloads/ufsdump",
    "payloads/memprobe",
    "payloads/ufsinit2",
    "payloads/ufsreset",
    "payloads/ufsdme",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = "s"       # size-optimized for embedded
lto = true
codegen-units = 1
panic = "abort"

# The display server's per-pixel paths are measured for speed, not size (the ODT timing, 2026-10-24).
[profile.release.package.ferros-payload-display]
opt-level = 3

# The attest screen's mark (tapuwae, four samples at a time): at "s" LLVM's vectoriser is off and it runs on scalar float, so it builds for speed (2026-10-29: no `.4s` ops at "s", 1850 at 3).
[profile.release.package.ferros-payload-ahau]
opt-level = 3

# The wallpaper (wallpaper/): a Julia set worked out per pixel at attest, its orbits four lanes at a time on NEON; built for speed wherever it is linked.
[profile.release.package.wallpaper]
opt-level = 3

# The USB driver's packet path (KERNEL-OUT.md, USB.md): per-chunk BLAKE3 and the copies around it are its CPU time, 81 ms of every 2 MiB received at "s"; built for speed, with BLAKE3 itself, wherever it is linked.
[profile.release.package.ferros-payload-usb]
opt-level = 3

[profile.release.package.blake3]
opt-level = 3

# Host tools in dev builds: the bridge hashes and frames every PT packet, and unoptimised BLAKE3 there held a 2 MiB transfer to the device at 240 ms against 102 ms built for speed (2026-10-31).
[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.ferros_pt]
opt-level = 3
