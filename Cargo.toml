[workspace]
resolver = "3"
members = [
    "ferros_layout",
    "ferros_kernel",
    "ferros_hal",
    "ferros_hal_m1",
    "vault",
    "ferros_ledger",
    "ferros_pt",
    "ferros_heap",
    "ferros_seed",
    "tools/mkimg",
    "tools/ferros-bridge",
    "tools/ferros-mask",
    "tools/install",
    "payloads/hello",
    "payloads/hello_el0",
    "payloads/echo_server",
    "payloads/echo_client",
    "payloads/spinner",
    "payloads/pcie1",
    "ferros_sys",
    "ferros_sandbox",
    "photon_core",
    "payloads/ip",
    "payloads/nettest",
    "payloads/wxtest",
    "payloads/beamtest",
    "payloads/wdtfire",
    "payloads/usbprobe",
    "payloads/pmuprobe",
    "payloads/pmupoke",
    "payloads/repeaterprobe",
    "payloads/repeatertune",
    "payloads/dispprobe",
    "payloads/hangtest",
    "payloads/vendorprobe",
    "payloads/ufsfix",
    "payloads/slot1nop",
    "payloads/miscprobe",
    "payloads/ufsdump",
    "payloads/memprobe",
    "payloads/ufsinit2",
    "payloads/ufsreset",
    "payloads/ufsdme",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = "s"       # size-optimized for embedded
lto = true
codegen-units = 1
panic = "abort"
